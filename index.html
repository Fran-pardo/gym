<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151B" media="(prefers-color-scheme: dark)">
<title>Gym</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232B44E8'/%3E%3Crect x='8' y='14' width='16' height='4' rx='2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#1B2230; --muted:#6B7385; --line:#E3E6EB;
  --accent:#2B44E8; --accent-ink:#FFFFFF; --danger:#C8382E;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151B; --surface:#1A1E26; --ink:#ECEFF4; --muted:#8E97A8; --line:#2A303B;
    --accent:#7C8CFF; --accent-ink:#10131A; --danger:#FF7B72;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  -webkit-tap-highlight-color:transparent;
}
main{max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 18px) 18px 0}
h1,h2,h3,p{margin:0}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.muted{color:var(--muted)}
.small{font-size:14px}

/* Barra superior */
.top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:20px}
.top h2{font-size:18px; font-weight:600}
.top .link:first-child{justify-self:start}

/* Botones */
.btn{
  display:block; width:100%; padding:15px 18px; border:0; border-radius:14px;
  background:var(--accent); color:var(--accent-ink); font-weight:600; text-align:center; cursor:pointer;
  transition:transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.link{background:none; border:0; padding:10px 0; color:var(--accent); cursor:pointer}
.link.danger{color:var(--danger)}
.link:disabled{opacity:.35; cursor:default}

/* Inicio */
.hero{padding:28px 0 26px}
.hero h1{font-size:20px; font-weight:500; color:var(--muted)}
.hero .day{display:block; font-size:44px; line-height:1.1; font-weight:700; letter-spacing:-.02em; color:var(--ink); margin:2px 0 8px}
.hero .meta{margin-bottom:22px}
.hero .btn + .link{display:block; margin:6px auto 0}

h2.section{font-size:15px; font-weight:600; color:var(--muted); margin:8px 0 8px}
.list{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.row{
  display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%;
  padding:15px 16px; background:none; border:0; border-bottom:1px solid var(--line); text-align:left; cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.row .name{font-weight:500}
.foot{display:flex; justify-content:space-between; margin:18px 0 28px}
.note{margin:18px 0 0; padding-left:12px; border-left:2px solid var(--accent); font-size:14px}
.warn{margin:0 0 16px; padding:12px 14px; border-radius:12px; border:1px solid var(--danger); color:var(--danger); font-size:14px}

/* Tarjetas */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px}
.ex-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.ex-head h3{font-size:17px; font-weight:600}
.last{color:var(--muted); font-size:14px; margin:4px 0 0}
.tip{font-size:14px; margin:10px 0 14px; padding-left:10px; border-left:2px solid var(--accent)}
.sets{margin-top:12px}

/* Series */
.set{display:grid; grid-template-columns:26px 1fr 1fr 44px; gap:8px; align-items:center; margin-bottom:8px}
.set.head{margin-bottom:4px; font-size:13px; color:var(--muted); text-align:center}
.set .n{color:var(--muted); font-size:14px; text-align:center}
.set input{
  width:100%; height:44px; border-radius:10px; border:1px solid transparent; background:var(--bg);
  text-align:center; font-variant-numeric:tabular-nums; font-size:16px; padding:0 6px;
}
.set input::placeholder{color:var(--muted); opacity:.75}
.set input:focus{border-color:var(--accent); outline:none}
.set.done input{color:var(--muted)}
.chk{
  width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:transparent;
  display:grid; place-items:center; cursor:pointer; padding:0;
}
.chk svg{width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
.set.done .chk{background:var(--accent); border-color:var(--accent)}
.set.done .chk svg{stroke:var(--accent-ink)}
.tools{display:flex; gap:18px; margin-top:4px}
.tools .link{padding:8px 0; font-size:14px}
.hist{margin-top:6px; font-size:14px; color:var(--muted)}
.hist div{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-top:1px solid var(--line)}
.hist span:last-child{text-align:right; font-variant-numeric:tabular-nums}

/* Barra inferior */
.bar{
  position:sticky; bottom:0; margin:8px -18px 0; padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);
  background:var(--bg); border-top:1px solid var(--line);
}

/* Editor de rutina */
.title-in{
  width:100%; border:0; border-bottom:1px solid var(--line); background:none; padding:6px 0 8px;
  font-size:19px; font-weight:600; border-radius:0;
}
.title-in:focus{outline:none; border-color:var(--accent)}
.day-head{display:flex; align-items:end; gap:10px; margin-bottom:6px}
.mini{display:flex; gap:2px; flex-shrink:0}
.mini button{
  width:36px; height:36px; border:0; border-radius:10px; background:none; color:var(--muted);
  font-size:17px; cursor:pointer;
}
.mini button:active{background:var(--bg)}
.mini button:disabled{opacity:.3}
.ex-edit{padding:12px 0; border-bottom:1px solid var(--line)}
.ex-edit:last-of-type{border-bottom:0}
.ex-edit .name-in{
  width:100%; height:42px; border-radius:10px; border:1px solid transparent; background:var(--bg); padding:0 12px; font-size:16px;
}
.name-in:focus,.num-in:focus{border-color:var(--accent); outline:none}
.ex-cfg{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; color:var(--muted); font-size:14px}
.cfg{display:flex; align-items:center; gap:6px}
.num-in{
  width:54px; height:38px; border-radius:10px; border:1px solid transparent; background:var(--bg);
  text-align:center; font-size:16px; padding:0;
}
.card .link{display:block}

.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px;
  opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100vw - 40px); text-align:center;
}
.toast.on{opacity:1}
.spacer{height:calc(env(safe-area-inset-bottom) + 28px)}
@media (prefers-reduced-motion:reduce){.btn,.toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><main><p>Esta página necesita JavaScript.</p></main></noscript>

<script>
(function(){
'use strict';

/* ---------- Datos ---------- */
const KEY='gym.v1';
let storageOK=true;
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);

function fresh(){
  const ex=(name,sets,reps)=>({id:uid(),name,sets,reps});
  return {
    v:1,
    routine:{days:[
      {id:uid(),name:'Tren superior',exercises:[
        ex('Press militar con mancuernas',3,10),ex('Remo en polea',3,10),ex('Elevaciones laterales',3,12),
        ex('Curl de bíceps',3,12),ex('Extensión de tríceps',3,12)]},
      {id:uid(),name:'Pecho',exercises:[
        ex('Press banca',4,8),ex('Press inclinado con mancuernas',3,10),ex('Aperturas',3,12),
        ex('Fondos',3,10),ex('Tríceps en polea',3,12)]},
      {id:uid(),name:'Espalda',exercises:[
        ex('Jalón al pecho',4,10),ex('Remo con barra',4,8),ex('Remo en polea baja',3,10),
        ex('Face pull',3,15),ex('Curl martillo',3,12)]},
      {id:uid(),name:'Piernas',exercises:[
        ex('Sentadilla',4,8),ex('Prensa',3,10),ex('Peso muerto rumano',3,10),
        ex('Curl femoral',3,12),ex('Elevación de gemelos',4,15)]}
    ]},
    sessions:[],
    lastDayId:null,
    draft:null,
    lastExport:null
  };
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw); if(d&&d.routine&&Array.isArray(d.routine.days)&&Array.isArray(d.sessions))return d;}
  }catch(e){}
  return fresh();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db)); return true;}
  catch(e){storageOK=false; return false;}
}
let db=load();
try{localStorage.setItem('gym.test','1');localStorage.removeItem('gym.test');}catch(e){storageOK=false;}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
save();

/* ---------- Utilidades ---------- */
const $app=document.getElementById('app');
const ui={view:'home',expanded:{},rendered:null};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?null:n;};
const fmt=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:2});
const show=n=>String(n).replace('.',',');
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function daysAgo(s){
  const [y,m,d]=s.split('-').map(Number); const a=new Date(y,m-1,d); const n=new Date();
  return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-a)/864e5);
}
function agoText(s){const n=daysAgo(s); if(n<=0)return 'hoy'; if(n===1)return 'ayer'; return 'hace '+n+' días';}
function dateLabel(s){const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('es-ES',{day:'numeric',month:'short'});}
function move(arr,i,dir){const j=i+dir; if(j<0||j>=arr.length)return; [arr[i],arr[j]]=[arr[j],arr[i]];}

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2200);
}

/* ---------- Historial ---------- */
function sessionsFor(ex){
  const name=(ex.name||'').toLowerCase(); const out=[];
  [...db.sessions].sort((a,b)=>b.ts-a.ts).forEach(s=>{
    const e=s.exercises.find(x=>x.exId===ex.id)||s.exercises.find(x=>(x.name||'').toLowerCase()===name);
    if(e&&e.sets.length)out.push({s,e});
  });
  return out;
}
function lastFor(dayId,ex){
  const all=sessionsFor(ex);
  return all.find(x=>x.s.dayId===dayId)||all[0]||null;
}
function lastDone(dayId){
  const l=db.sessions.filter(s=>s.dayId===dayId).sort((a,b)=>b.ts-a.ts)[0];
  return l?l.date:null;
}
function fmtSets(sets){
  const ws=[...new Set(sets.map(s=>s.w))];
  if(ws.length===1){
    return ws[0]?fmt(ws[0])+' kg × '+sets.map(s=>s.r).join(', '):sets.map(s=>s.r).join(', ')+' reps';
  }
  return sets.map(s=>fmt(s.w)+' × '+s.r).join(', ');
}
function suggest(last,ex){
  if(!last)return 'Primera vez con este ejercicio: elige un peso con el que llegues a las repeticiones objetivo.';
  const sets=last.e.sets; const top=Math.max(...sets.map(s=>s.w));
  const hit=sets.length>=ex.tSets&&sets.every(s=>s.r>=ex.tReps);
  if(hit){
    return top>0
      ?'Completaste todas las series. Si hoy te sientes bien, sube a '+fmt(top+1)+' kg o haz 1 repetición más.'
      :'Completaste todas las series. Si hoy te sientes bien, haz 1 repetición más.';
  }
  return top>0
    ?'No llegaste a todas las repeticiones. Repite '+fmt(top)+' kg e intenta completarlas.'
    :'No llegaste a todas las repeticiones. Intenta completarlas.';
}
function nextDay(){
  const days=db.routine.days; if(!days.length)return null;
  const i=days.findIndex(d=>d.id===db.lastDayId);
  return days[(i+1)%days.length];
}

/* ---------- Vistas ---------- */
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function banner(){
  return storageOK?'':'<p class="warn">Este navegador no permite guardar datos (¿pestaña privada?). Lo que anotes se perderá al cerrar.</p>';
}

function viewHome(){
  const days=db.routine.days;
  if(!days.length){
    return banner()+'<div class="hero"><h1>Aún no hay rutina</h1><p class="muted meta" style="margin-top:8px">Crea tu primer día para empezar.</p>'+
      '<button class="btn" data-a="go" data-v="routine">Crear rutina</button></div>';
  }
  const draft=db.draft&&days.find(d=>d.id===db.draft.dayId)?db.draft:null;
  const nd=draft?days.find(d=>d.id===draft.dayId):nextDay();
  const ld=lastDone(nd.id);
  const meta=nd.exercises.length+(nd.exercises.length===1?' ejercicio':' ejercicios')+(ld?', última vez '+agoText(ld):'');
  const others=days.filter(d=>d.id!==nd.id);
  const stale=db.sessions.length>0&&(!db.lastExport||daysAgo(db.lastExport)>30);

  let h=banner()+'<section class="hero"><h1>'+(draft?'Sesión en curso':'Te toca')+'</h1>'+
    '<span class="day">'+esc(nd.name||'Sin nombre')+'</span><p class="muted meta">'+esc(meta)+'</p>'+
    '<button class="btn" data-a="start" data-id="'+nd.id+'">'+(draft?'Continuar sesión':'Empezar sesión')+'</button>'+
    (draft?'<button class="link danger" data-a="discard">Descartar sesión</button>':'')+'</section>';

  if(others.length){
    h+='<h2 class="section">Otros días</h2><div class="list">'+others.map(d=>{
      const l=lastDone(d.id);
      return '<button class="row" data-a="start" data-id="'+d.id+'"><span class="name">'+esc(d.name||'Sin nombre')+
        '</span><span class="muted small">'+(l?agoText(l):'sin registros')+'</span></button>';
    }).join('')+'</div>';
  }
  h+='<nav class="foot"><button class="link" data-a="go" data-v="routine">Editar rutina</button>'+
     '<button class="link" data-a="go" data-v="data">Datos</button></nav>';
  if(stale)h+='<p class="note muted">Hace tiempo que no exportas una copia. Puedes hacerlo en Datos.</p>';
  return h+'<div class="spacer"></div>';
}

function viewSession(){
  const d=db.draft;
  if(!d){ui.view='home';return viewHome();}
  const cards=d.exercises.map((ex,xi)=>{
    const ref={id:ex.exId,name:ex.name};
    const last=lastFor(d.dayId,ref);
    const ls=last?last.e.sets:null;
    const rows=ex.sets.map((s,si)=>{
      const ph=ls?(ls[si]||ls[ls.length-1]):null;
      return '<div class="set'+(s.done?' done':'')+'"><span class="n">'+(si+1)+'</span>'+
        '<input inputmode="decimal" placeholder="'+(ph?esc(fmt(ph.w)):'kg')+'" value="'+esc(s.w)+'" data-f="w" data-x="'+xi+'" data-s="'+si+'" aria-label="Peso en kg, serie '+(si+1)+'">'+
        '<input inputmode="numeric" placeholder="'+(ph?esc(ph.r):'reps')+'" value="'+esc(s.r)+'" data-f="r" data-x="'+xi+'" data-s="'+si+'" aria-label="Repeticiones, serie '+(si+1)+'">'+
        '<button class="chk" data-a="toggle" data-x="'+xi+'" data-s="'+si+'" aria-pressed="'+s.done+'" aria-label="Marcar serie '+(si+1)+'">'+CHECK+'</button></div>';
    }).join('');

    let hist='';
    if(ui.expanded[ex.exId]){
      const older=sessionsFor(ref).filter(x=>!last||x.s.id!==last.s.id).slice(0,4);
      hist='<div class="hist">'+(older.length?older.map(x=>'<div><span>'+esc(dateLabel(x.s.date))+'</span><span>'+esc(fmtSets(x.e.sets))+'</span></div>').join(''):'<div><span>Sin sesiones anteriores</span></div>')+'</div>';
    }
    return '<section class="card"><div class="ex-head"><h3>'+esc(ex.name||'Sin nombre')+'</h3><span class="muted small">'+ex.tSets+' × '+ex.tReps+'</span></div>'+
      '<p class="last">'+(last?'Última vez, '+esc(agoText(last.s.date))+': '+esc(fmtSets(last.e.sets)):'Sin registros todavía')+'</p>'+
      '<p class="tip">'+esc(suggest(last,ex))+'</p>'+
      '<div class="sets"><div class="set head"><span></span><span>kg</span><span>reps</span><span></span></div>'+rows+'</div>'+
      '<div class="tools"><button class="link" data-a="addset" data-x="'+xi+'">Añadir serie</button>'+
      (ex.sets.length>1?'<button class="link" data-a="delset" data-x="'+xi+'">Quitar serie</button>':'')+
      '<button class="link" data-a="hist" data-id="'+ex.exId+'">'+(ui.expanded[ex.exId]?'Ocultar anteriores':'Ver anteriores')+'</button></div>'+hist+'</section>';
  }).join('');

  return '<div class="top"><button class="link" data-a="go" data-v="home">Inicio</button><h2>'+esc(d.dayName||'Sesión')+'</h2><span></span></div>'+
    banner()+cards+'<div class="bar"><button class="btn" data-a="finish">Terminar sesión</button></div>';
}

function viewRoutine(){
  const days=db.routine.days;
  const body=days.map((d,di)=>{
    const exs=d.exercises.map((e,ei)=>
      '<div class="ex-edit"><input class="name-in" value="'+esc(e.name)+'" placeholder="Nombre del ejercicio" data-r="ename" data-d="'+di+'" data-e="'+ei+'" aria-label="Nombre del ejercicio">'+
      '<div class="ex-cfg"><span class="cfg"><input class="num-in" type="number" inputmode="numeric" min="1" max="20" value="'+e.sets+'" data-r="esets" data-d="'+di+'" data-e="'+ei+'" aria-label="Series"> series ×'+
      ' <input class="num-in" type="number" inputmode="numeric" min="1" max="99" value="'+e.reps+'" data-r="ereps" data-d="'+di+'" data-e="'+ei+'" aria-label="Repeticiones"> reps</span>'+
      '<span class="mini"><button data-a="eup" data-d="'+di+'" data-e="'+ei+'" aria-label="Subir ejercicio"'+(ei===0?' disabled':'')+'>↑</button>'+
      '<button data-a="edown" data-d="'+di+'" data-e="'+ei+'" aria-label="Bajar ejercicio"'+(ei===d.exercises.length-1?' disabled':'')+'>↓</button>'+
      '<button data-a="edel" data-d="'+di+'" data-e="'+ei+'" aria-label="Eliminar ejercicio">✕</button></span></div></div>').join('');
    return '<section class="card"><div class="day-head"><input class="title-in" value="'+esc(d.name)+'" placeholder="Nombre del día" data-r="dname" data-d="'+di+'" aria-label="Nombre del día">'+
      '<span class="mini"><button data-a="dup" data-d="'+di+'" aria-label="Subir día"'+(di===0?' disabled':'')+'>↑</button>'+
      '<button data-a="ddown" data-d="'+di+'" aria-label="Bajar día"'+(di===days.length-1?' disabled':'')+'>↓</button></span></div>'+
      exs+'<button class="link" data-a="addex" data-d="'+di+'">Añadir ejercicio</button>'+
      '<button class="link danger" data-a="delday" data-d="'+di+'">Eliminar día</button></section>';
  }).join('');
  return '<div class="top"><button class="link" data-a="go" data-v="home">Listo</button><h2>Rutina</h2><span></span></div>'+
    banner()+body+'<button class="btn sec" data-a="addday">Añadir día</button>'+
    '<p class="muted small" style="margin-top:14px">Los cambios se guardan solos. El historial se conserva aunque cambies o borres ejercicios.</p><div class="spacer"></div>';
}

function viewData(){
  const n=db.sessions.length;
  return '<div class="top"><button class="link" data-a="go" data-v="home">Inicio</button><h2>Datos</h2><span></span></div>'+banner()+
    '<section class="card"><p><strong>'+n+(n===1?' sesión':' sesiones')+'</strong> guardadas en este navegador.</p>'+
    '<p class="muted small" style="margin:4px 0 16px">'+(db.lastExport?'Última copia: '+esc(agoText(db.lastExport)):'Todavía no has exportado ninguna copia.')+'</p>'+
    '<button class="btn" data-a="export">Exportar CSV</button>'+
    '<label class="btn sec" for="imp" style="margin-top:10px">Importar CSV</label>'+
    '<input id="imp" type="file" accept=".csv,text/csv" hidden></section>'+
    '<p class="muted small">Los datos viven solo en este dispositivo. Exporta de vez en cuando para tener una copia; con el CSV puedes recuperarlo todo.</p>'+
    '<button class="link danger" data-a="wipe" style="margin-top:10px">Borrar todos los datos</button><div class="spacer"></div>';
}

function render(){
  const y=window.scrollY;
  const views={home:viewHome,session:viewSession,routine:viewRoutine,data:viewData};
  $app.innerHTML=views[ui.view]();
  window.scrollTo(0,ui.rendered===ui.view?y:0);
  ui.rendered=ui.view;
}

/* ---------- Sesión ---------- */
function startDay(id){
  const day=db.routine.days.find(d=>d.id===id); if(!day)return;
  if(db.draft&&db.draft.dayId!==id&&!confirm('Tienes una sesión sin terminar. ¿Descartarla y empezar esta?'))return;
  if(!db.draft||db.draft.dayId!==id){
    db.draft={dayId:id,dayName:day.name,startedAt:Date.now(),exercises:day.exercises.map(e=>({
      exId:e.id,name:e.name,tSets:e.sets,tReps:e.reps,
      sets:Array.from({length:e.sets},()=>({w:'',r:'',done:false}))
    }))};
    save();
  }
  ui.view='session'; render();
}

function toggleSet(xi,si){
  const d=db.draft; const ex=d.exercises[xi]; const s=ex.sets[si];
  if(s.done){s.done=false;}
  else{
    const last=lastFor(d.dayId,{id:ex.exId,name:ex.name}); const ls=last?last.e.sets:null;
    const ph=ls?(ls[si]||ls[ls.length-1]):null;
    let w=num(s.w), r=num(s.r);
    if(r===null&&ph)r=ph.r;
    if(w===null&&ph)w=ph.w;
    if(r===null||r<=0){toast('Anota las repeticiones'); return;}
    if(w===null)w=0;
    s.w=show(w); s.r=String(r); s.done=true;
  }
  save(); render();
}

function finish(){
  const d=db.draft; if(!d)return;
  const pending=d.exercises.some(e=>e.sets.some(s=>!s.done&&(num(s.r)!==null)));
  const exs=d.exercises.map(e=>({
    exId:e.exId,name:e.name,
    sets:e.sets.filter(s=>s.done).map(s=>({w:num(s.w)||0,r:num(s.r)}))
  })).filter(e=>e.sets.length);
  if(!exs.length){
    if(confirm('No has marcado ninguna serie. ¿Descartar la sesión?')){db.draft=null; save(); ui.view='home'; render();}
    return;
  }
  if(pending&&!confirm('Hay series con datos que no has marcado con el check. ¿Terminar sin ellas?'))return;
  db.sessions.push({id:uid(),dayId:d.dayId,dayName:d.dayName,ts:Date.now(),date:todayStr(),exercises:exs});
  db.lastDayId=d.dayId; db.draft=null; save();
  ui.view='home'; render(); toast('Sesión guardada');
}

/* ---------- CSV ---------- */
function cell(v){v=String(v); return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(){
  const rows=[['sesion_id','fecha','dia','ejercicio','serie','peso_kg','repeticiones']];
  [...db.sessions].sort((a,b)=>a.ts-b.ts).forEach(s=>s.exercises.forEach(e=>e.sets.forEach((st,i)=>
    rows.push([s.id,s.date,s.dayName,e.name,i+1,st.w,st.r]))));
  return rows.map(r=>r.map(cell).join(',')).join('\r\n');
}
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c;
    }else if(c==='"'){q=true;}
    else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=''; rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f); rows.push(row);}
  return rows;
}
async function exportCSV(){
  if(!db.sessions.length){toast('Aún no hay datos que exportar'); return;}
  const name='gym-'+todayStr()+'.csv';
  const blob=new Blob(['\ufeff'+toCSV()],{type:'text/csv'});
  db.lastExport=todayStr(); save();
  try{
    const file=new File([blob],name,{type:'text/csv'});
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name}); render(); return;
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); render();
}
async function importCSV(file){
  const text=(await file.text()).replace(/^\ufeff/,'');
  const rows=parseCSV(text).filter(r=>r.length>1);
  if(rows.length<2){toast('El archivo está vacío'); return;}
  const head=rows[0].map(h=>h.trim().toLowerCase()); const ix=n=>head.indexOf(n);
  const c={id:ix('sesion_id'),fecha:ix('fecha'),dia:ix('dia'),ej:ix('ejercicio'),w:ix('peso_kg'),r:ix('repeticiones')};
  if(c.fecha<0||c.dia<0||c.ej<0||c.r<0){toast('Formato no reconocido'); return;}
  const groups=new Map();
  rows.slice(1).forEach(r=>{
    const fecha=(r[c.fecha]||'').trim(), dia=(r[c.dia]||'').trim(), ej=(r[c.ej]||'').trim();
    const rep=num(r[c.r]), w=c.w>=0?(num(r[c.w])||0):0;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)||!ej||rep===null)return;
    const id=(c.id>=0&&(r[c.id]||'').trim())||('imp-'+fecha+'-'+dia.toLowerCase());
    if(!groups.has(id))groups.set(id,{id,fecha,dia,exs:new Map()});
    const g=groups.get(id);
    if(!g.exs.has(ej))g.exs.set(ej,[]);
    g.exs.get(ej).push({w,r:rep});
  });
  const have=new Set(db.sessions.map(s=>s.id)); let added=0;
  groups.forEach(g=>{
    if(have.has(g.id))return;
    const day=db.routine.days.find(d=>(d.name||'').toLowerCase()===g.dia.toLowerCase());
    const [y,m,d]=g.fecha.split('-').map(Number);
    db.sessions.push({
      id:g.id,dayId:day?day.id:'imp:'+g.dia.toLowerCase(),dayName:g.dia||'Sin nombre',
      ts:new Date(y,m-1,d,12).getTime()+added,date:g.fecha,
      exercises:[...g.exs.entries()].map(([name,sets])=>{
        let id=null;
        db.routine.days.forEach(dd=>dd.exercises.forEach(e=>{if(!id&&(e.name||'').toLowerCase()===name.toLowerCase())id=e.id;}));
        return {exId:id||'imp:'+name.toLowerCase(),name,sets};
      })
    });
    added++;
  });
  save(); render();
  toast(added?('Importadas '+added+(added===1?' sesión':' sesiones')):'No había sesiones nuevas');
}

/* ---------- Eventos ---------- */
$app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t)return;
  const a=t.dataset.a, di=+t.dataset.d, ei=+t.dataset.e, xi=+t.dataset.x, si=+t.dataset.s;
  switch(a){
    case 'go': ui.view=t.dataset.v; render(); break;
    case 'start': startDay(t.dataset.id); break;
    case 'discard': if(confirm('¿Descartar la sesión en curso?')){db.draft=null; save(); render();} break;
    case 'toggle': toggleSet(xi,si); break;
    case 'addset': db.draft.exercises[xi].sets.push({w:'',r:'',done:false}); save(); render(); break;
    case 'delset': {const s=db.draft.exercises[xi].sets; if(s.length>1){s.pop(); save(); render();} break;}
    case 'hist': ui.expanded[t.dataset.id]=!ui.expanded[t.dataset.id]; render(); break;
    case 'finish': finish(); break;

    case 'dup': move(db.routine.days,di,-1); save(); render(); break;
    case 'ddown': move(db.routine.days,di,1); save(); render(); break;
    case 'eup': move(db.routine.days[di].exercises,ei,-1); save(); render(); break;
    case 'edown': move(db.routine.days[di].exercises,ei,1); save(); render(); break;
    case 'edel': db.routine.days[di].exercises.splice(ei,1); save(); render(); break;
    case 'addex': {
      db.routine.days[di].exercises.push({id:uid(),name:'',sets:3,reps:10}); save(); render();
      const els=$app.querySelectorAll('[data-r="ename"][data-d="'+di+'"]'); if(els.length)els[els.length-1].focus();
      break;
    }
    case 'delday':
      if(confirm('¿Eliminar este día de la rutina? Su historial se conserva.')){db.routine.days.splice(di,1); save(); render();}
      break;
    case 'addday': {
      db.routine.days.push({id:uid(),name:'Nuevo día',exercises:[]}); save(); render();
      const els=$app.querySelectorAll('[data-r="dname"]'); const l=els[els.length-1]; if(l){l.focus(); l.select();}
      break;
    }

    case 'export': exportCSV(); break;
    case 'wipe':
      if(confirm('Se borrarán la rutina y todo el historial de este navegador. ¿Continuar?')){
        db=fresh(); save(); ui.view='home'; render(); toast('Datos borrados');
      }
      break;
  }
});

$app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&db.draft){
    db.draft.exercises[+t.dataset.x].sets[+t.dataset.s][t.dataset.f]=t.value; save(); return;
  }
  if(!t.dataset.r)return;
  const d=db.routine.days[+t.dataset.d]; if(!d)return;
  const ex=d.exercises[+t.dataset.e];
  switch(t.dataset.r){
    case 'dname': d.name=t.value; break;
    case 'ename': if(ex)ex.name=t.value; break;
    case 'esets': {const n=parseInt(t.value,10); if(ex&&n>0&&n<=20)ex.sets=n; break;}
    case 'ereps': {const n=parseInt(t.value,10); if(ex&&n>0&&n<=99)ex.reps=n; break;}
  }
  save();
});

$app.addEventListener('change',e=>{
  if(e.target.id==='imp'&&e.target.files[0]){
    const f=e.target.files[0]; e.target.value='';
    importCSV(f).catch(()=>toast('No se pudo leer el archivo'));
  }
});

render();
})();
</script>
